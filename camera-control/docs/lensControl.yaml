openapi: 3.0.1
info:
  title: Lens Control API
  description: API For controlling the lens on Blackmagic Design products
  version: 1.2.0
servers:
- url: /control/api/v1
paths:
  /lens/virtual:
    x-private: true
    get:
      summary: Get virtual lens' description
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  apertureStop:
                    $ref: '#/components/schemas/apertureStop'
                  focusDistance:
                    $ref: '#/components/schemas/focusDistance'
                  focalLength:
                    $ref: '#/components/schemas/focalLength'
                  normalisedAperture:
                    $ref: '#/components/schemas/normalised'
                  normalisedFocus:
                    $ref: '#/components/schemas/normalised'
        403:
          description: Request cannot be performed in the current state.
    put:
      summary: Set virtual lens' description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lensName:
                  type: string
                  description: Name of the virtual lens
                  example: "Virtual lens"
                apertureStopType:
                  type: string
                  description: T or F stop
                  enum:
                    - FStop
                    - TStop
                apertureStop:
                  $ref: '#/components/schemas/apertureStop'
                focusDistance:
                  $ref: '#/components/schemas/focusDistance'
                focalLength:
                  $ref: '#/components/schemas/focalLength'
                normalisedAperture:
                  $ref: '#/components/schemas/normalised'
                normalisedFocus:
                  $ref: '#/components/schemas/normalised'
      responses:
        204:
          description: No Content
        403:
          description: Forbidden if the virtual lens driver is not active in the current state
  /lens/iris:
    get:
      summary: Get lens' aperture
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  continuousApertureAutoExposure:
                    type: boolean
                    description: Is Aperture controlled by auto exposure
                  apertureStop:
                    $ref: '#/components/schemas/apertureStop'
                  normalized:
                    $ref: '#/components/schemas/normalized'
                  normalised:
                    allOf:
                      - $ref: '#/components/schemas/normalised'
                    deprecated: true
                    description: "Deprecated: Use 'normalized' (American spelling) instead"
                  apertureNumber:
                    $ref: '#/components/schemas/apertureNumber'
        403:
          description: Request cannot be performed in the current state.
    put:
      summary: Set lens' aperture
      description: Only a single property need to be selected. If multiple provided, the order of priority is (apertureStop > normalized > apertureNumber > adjustmentStep)
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                properties:
                  apertureStop:
                    $ref: '#/components/schemas/apertureStop'
                  normalized:
                    $ref: '#/components/schemas/normalized'
                  normalised:
                    allOf:
                      - $ref: '#/components/schemas/normalised'
                    deprecated: true
                    description: "Deprecated: Use 'normalized' (American spelling) instead"
                  apertureNumber:
                    $ref: '#/components/schemas/apertureNumber'
                  adjustmentStep:
                    type: integer
                    description: Signed value for relative aperture adjustment
                    minimum: -128
                    maximum: 127
      responses:
        204:
          description: No Content
        400:
          description: Bad Request if out of range value is provided
        403:
          description: Forbidden if lens iris is not controllable or is controlled by auto exposure
  /lens/zoom:
    get:
      summary: Get lens' zoom
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  focalLength:
                    $ref: '#/components/schemas/focalLength'
                  normalized:
                    $ref: '#/components/schemas/normalized'
                  normalised:
                    allOf:
                      - $ref: '#/components/schemas/normalised'
                    deprecated: true
                    description: "Deprecated: Use 'normalized' (American spelling) instead"
        403:
          description: Request cannot be performed in the current state.
    put:
      summary: Set lens' zoom
      description: Only a single property need to be selected. If multiple provided, the order of priority is (focalLength > normalized > adjustmentFocalLength > adjustmentNormalized)
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                properties:
                  focalLength:
                    $ref: '#/components/schemas/focalLength'
                  normalized:
                    $ref: '#/components/schemas/normalized'
                  normalised:
                    allOf:
                      - $ref: '#/components/schemas/normalised'
                    deprecated: true
                    description: "Deprecated: Use 'normalized' (American spelling) instead"
                  adjustmentFocalLength:
                    type: integer
                    description: Signed value for relative focal length adjustment
                    minimum: -128
                    maximum: 127
                  adjustmentNormalized:
                    type: number
                    format: float
                    description: Signed normalized value for relative zoom adjustment
                    minimum: -1.0
                    maximum: 1.0
                  adjustmentNormalised:
                    type: number
                    format: float
                    description: Signed normalized value for relative zoom adjustment
                    minimum: -1.0
                    maximum: 1.0
                    deprecated: true
                    x-deprecation-message: "Use 'adjustmentNormalized' (American spelling) instead"
      responses:
        204:
          description: No Content
        400:
          description: Bad Request if out of range value is provided
        403:
          description: Forbidden if lens zoom is not controllable
  /lens/focus:
    get:
      summary: Get lens' focus
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  normalized:
                    $ref: '#/components/schemas/normalized'
                  normalised:
                    allOf:
                      - $ref: '#/components/schemas/normalised'
                    deprecated: true
                    description: "Deprecated: Use 'normalized' (American spelling) instead"
        403:
          description: Request cannot be performed in the current state.
    put:
      summary: Set lens' focus
      description: Only a single property need to be selected. If multiple provided, the order of priority is (normalized > focusDistance)
      requestBody:
        required: true
        content:
          application/json:
              schema:
                type: object
                properties:
                  normalized:
                    $ref: '#/components/schemas/normalized'
                  normalised:
                    allOf:
                      - $ref: '#/components/schemas/normalised'
                    deprecated: true
                    description: "Deprecated: Use 'normalized' (American spelling) instead"
                  focusDistance:
                    type: integer
                    description: Focus distance value
      responses:
        204:
          description: No Content
        400:
          description: Bad Request if out of range value is provided
  /lens/focus/doAutoFocus:
    put:
      summary: Perform auto focus
      description: If no position is provided, center of frame (0.5, 0.5) will be used for autofocus ROI
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: object
                  properties:
                    x:
                      type: number
                      format: float
                      description: Normalized x coordinate for autofocus ROI
                      minimum: 0.0
                      maximum: 1.0
                    y:
                      type: number
                      format: float
                      description: Normalized y coordinate for autofocus ROI
                      minimum: 0.0
                      maximum: 1.0
      responses:
        204:
          description: No Content
        400:
          description: Bad Request if out of range value is provided
        403:
          description: Forbidden if lens focus is not controllable
  /lens/focus/autoFocus:
    get:
      summary: Get autofocus status
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  supported:
                    type: boolean
                    description: Whether autofocus is supported with the current lens
                  enabled:
                    type: boolean
                    description: Whether autofocus is currently active
                  mode:
                    $ref: '#/components/schemas/autofocusMode'
                  state:
                    type: string
                    description: Current autofocus state
                    enum:
                      - Idle
                      - Focusing
                      - Focused
                      - Paused
                      - Error
                  errors:
                    type: array
                    description: List of active autofocus errors
                    items:
                      type: string
                      enum:
                        - TooClose
                        - LostTracking
                        - ManualFocus
    put:
      summary: Set autofocus mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Enable or disable autofocus
                mode:
                  $ref: '#/components/schemas/autofocusMode'
      responses:
        204:
          description: No Content
        403:
          description: Forbidden if lens focus is not controllable

  /lens/focus/autoFocus/description:
    get:
      summary: Get autofocus capabilities description
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  supported:
                    type: boolean
                    description: Whether autofocus is supported with the current lens
                  supportedModes:
                    type: array
                    description: List of autofocus modes available on this product
                    items:
                      $ref: '#/components/schemas/autofocusMode'

  /lens/focus/autoFocus/target:
    get:
      summary: Get current autofocus target region
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/autofocusTargetRect'
    put:
      summary: Set autofocus target position or region
      description: Set the autofocus target as a point (x, y only) or as a rectangle (x, y, width, height). If width and height are provided, they must both be present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x, y]
              properties:
                x:
                  type: number
                  format: float
                  description: Normalized x coordinate of the target
                  minimum: 0.0
                  maximum: 1.0
                y:
                  type: number
                  format: float
                  description: Normalized y coordinate of the target
                  minimum: 0.0
                  maximum: 1.0
                width:
                  type: number
                  format: float
                  description: Normalized width of the target region
                  minimum: 0.0
                  maximum: 1.0
                height:
                  type: number
                  format: float
                  description: Normalized height of the target region
                  minimum: 0.0
                  maximum: 1.0
      responses:
        204:
          description: No Content
        400:
          description: Bad Request if width is provided without height or vice versa
        403:
          description: Forbidden if lens focus is not controllable

  /lens/focus/autoFocus/retrigger:
    put:
      summary: Retrigger autofocus
      description: Retrigger autofocus using the current target. In OneShot mode this restarts the focus operation.
      responses:
        204:
          description: No Content
        403:
          description: Forbidden if lens focus is not controllable

  /lens/opticalImageStabilization:
    get:
      summary: Get optical image stabilization status
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Whether optical image stabilization is enabled
                  controlAvailable:
                    type: boolean
                    description: Whether optical image stabilization can be controlled
        501:
          description: Not Implemented if optical image stabilization is not supported on this product
        403:
          description: Forbidden if optical image stabilization is not controllable in the current state
    put:
      summary: Enable or disable optical image stabilization
      description: |
        Enable or disable optical image stabilization. The request is rejected
        with 403 when the lens does not currently expose a controllable OIS
        (see `controlAvailable` in the GET response).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: Enable or disable optical image stabilization
      responses:
        204:
          description: No Content
        400:
          description: Bad Request if the body is missing the `enabled` field
        403:
          description: Forbidden if optical image stabilization is not controllable in the current state
        501:
          description: Not Implemented if optical image stabilization is not supported on this product
  /lens/iris/description:
    get:
      summary: Get detailed description of lens' iris capabilities
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  controllable:
                    type: boolean
                    description: If the iris can be controlled
                  apertureStop:
                    type: object
                    properties:
                      min:
                        type: number
                        format: float
                        description: Minimum aperture stop
                      max:
                        type: number
                        format: float
                        description: Maximum aperture stop
        403:
          description: Request cannot be performed in the current state.

  /lens/zoom/description:
    get:
      summary: Get detailed description of lens' zoom capabilities
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  controllable:
                    type: boolean
                    description: If the zoom can be controlled
                  focalLength:
                    type: object
                    properties:
                      adjustable:
                        type: boolean
                        description: If focal length is adjustable
                      min:
                        type: number
                        format: float
                        description: Minimum focal length
                      max:
                        type: number
                        format: float
                        description: Maximum focal length
        403:
          description: Request cannot be performed in the current state.

  /lens/focus/description:
    get:
      summary: Get detailed description of lens' focus capabilities
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  controllable:
                    type: boolean
                    description: If the focus can be controlled
                  focusDistance:
                    type: object
                    properties:
                      adjustable:
                        type: boolean
                        description: If focus distance is adjustable
                      min:
                        type: number
                        format: float
                        description: Minimum focus distance
                      max:
                        type: number
                        format: float
                        description: Maximum focus distance
        403:
          description: Request cannot be performed in the current state.

  /lens/cameras:
    get:
      summary: Get available camera lenses
      description: Returns the list of all physical camera lenses on the device with their properties and selection state
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cameras:
                    type: array
                    items:
                      $ref: '#/components/schemas/lensCamera'
  /lens/cameras/active:
    get:
      summary: Get the currently active camera lens
      description: Returns the currently selected camera lens
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lensCamera'
    put:
      summary: Select a camera lens
      description: Switches to the specified camera lens by its id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Camera id to activate
                  example: "back_main"
      responses:
        204:
          description: No Content
        400:
          description: Bad request - invalid camera id or lens unavailable
  /lens/cameras/auto:
    get:
      summary: Get auto lens mode status
      description: Returns whether auto lens selection is enabled and if it's supported
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/autoLensMode'
    put:
      summary: Enable or disable auto lens mode
      description: Switches between automatic and manual lens selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: Enable or disable auto lens selection
      responses:
        204:
          description: No Content
        400:
          description: Bad request - auto lens not supported

components:
  schemas:
    apertureStop:
      type: number
      format: float
      description: Aperture stop value
    focusDistance:
      type: number
      format: float
      description: Focus distance in meters
      minimum: 0
    normalized:
      type: number
      format: float
      description: Normalized value
      maximum: 1.0
      minimum: 0.0
    normalised:
      type: number
      format: float
      description: Normalized value
      maximum: 1.0
      minimum: 0.0
      deprecated: true
      x-deprecation-message: "Use 'normalized' (American spelling) instead"
    apertureNumber:
      type: integer
      description: Aperture number
    focalLength:
      type: number
      format: float
      description: Focal length in mm
      minimum: 0
    autofocusMode:
      type: string
      description: Autofocus operating mode
      enum:
        - OneShot
        - Continuous
        - TrackObject
        - TrackFace
    autofocusTargetRect:
      type: object
      description: Normalized rectangle describing the autofocus target region
      properties:
        x:
          type: number
          format: float
          description: Normalized x coordinate (left edge)
          minimum: 0.0
          maximum: 1.0
        y:
          type: number
          format: float
          description: Normalized y coordinate (top edge)
          minimum: 0.0
          maximum: 1.0
        width:
          type: number
          format: float
          description: Normalized width of the region
          minimum: 0.0
          maximum: 1.0
        height:
          type: number
          format: float
          description: Normalized height of the region
          minimum: 0.0
          maximum: 1.0
    lensCamera:
      type: object
      required: [id, facing, focalLength, zoomFactor, isActive, isAvailable, index]
      properties:
        id:
          type: string
          description: Unique camera identifier
          example: "back_main"
        facing:
          type: string
          description: Which direction the camera faces
          enum:
            - back
            - front
            - external
        focalLength:
          type: integer
          description: Focal length in millimeters
          example: 24
        zoomFactor:
          type: string
          description: Human-readable zoom factor label
          example: "1x"
        isActive:
          type: boolean
          description: Whether this lens is currently selected
        isAvailable:
          type: boolean
          description: Whether this lens can currently be selected
        index:
          type: integer
          description: Position in the lens list
    autoLensMode:
      type: object
      required: [enabled, supported]
      properties:
        enabled:
          type: boolean
          description: Whether auto lens selection is currently enabled
        supported:
          type: boolean
          description: Whether auto lens selection is supported on this device
